name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: match Cargo.toml to tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert Cargo.toml version matches tag
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cargo_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ -z "$cargo_version" ]; then
            echo "Could not read version from Cargo.toml"
            exit 1
          fi
          if [ "$cargo_version" != "$version" ]; then
            echo "Cargo.toml version ($cargo_version) does not match tag ($tag)."
            echo "Bump version in Cargo.toml to $version before tagging."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing lazyamp $version from $tag"

  build:
    name: build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-14
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-14
            zigbuild: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release binary (musl via cargo-zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Build release binary
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package tarball
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          staging="lazyamp-${VERSION}-${TARGET}"
          mkdir -p "$staging"
          cp "target/${TARGET}/release/lazyamp" "$staging/"
          cp LICENSE README.md "$staging/"
          # Avoid AppleDouble metadata files in the archive on macOS.
          COPYFILE_DISABLE=1 tar -czf "${staging}.tar.gz" "$staging"
          ls -lh "${staging}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: lazyamp-${{ needs.check-version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: github release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          set -eu
          sha256sum *.tar.gz | tee checksums.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: lazyamp ${{ needs.check-version.outputs.version }}
          tag_name: ${{ needs.check-version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            Install the latest binary:

            ```bash
            curl -fsSL https://raw.githubusercontent.com/miltonparedes/lazyamp/main/scripts/install.sh | sh
            ```

            Pin a version (the variable must be set on `sh`, not `curl`):

            ```bash
            curl -fsSL https://raw.githubusercontent.com/miltonparedes/lazyamp/main/scripts/install.sh | VERSION=${{ needs.check-version.outputs.tag }} sh
            ```

            Linux archives are musl static builds (`x86_64-unknown-linux-musl`,
            `aarch64-unknown-linux-musl`) so they run on older glibc distros.
            Archives and `checksums.txt` are attached to this release.
