[package]
name = "lazyamp"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Terminal UI for managing Amp --no-tui runners"
repository = "https://github.com/miltonparedes/lazyamp"
readme = "README.md"
keywords = ["amp", "tui", "runner"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
dirs = "6"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
